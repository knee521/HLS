[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "exp3-mnist-fpga"
version = "1.0.0"
description = "Reproducible MNIST MLP deployment for Vivado HLS 2018.3"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.1.3", "Pillow==11.0.0", "pyserial==3.5"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[tool.setuptools.packages.find]
include = ["common*", "train*", "host*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".work", ".venv", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

